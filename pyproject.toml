[project]
name = "mcp-bybit"
version = "0.1.0"
description = "MCP-сервер для спотовых рыночных данных биржи Bybit (v5 API): поиск пар, текущая цена, история цен"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "pydantic>=2.12",
]

[project.scripts]
mcp-bybit = "mcp_bybit.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bybit"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
